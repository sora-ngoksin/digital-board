<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Digital Board Player 9:16</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Tahoma,sans-serif;
}

#stageWrap{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#000;
}

#stage{
  position:absolute;
  width:1080px;
  height:1920px;
  left:0;
  top:0;
  transform-origin:0 0;
  background:#071a33;
  overflow:hidden;
}

.slide{
  position:absolute;
  left:0;
  top:0;
  width:1080px;
  height:1920px;
  display:none;
  background-size:cover;
  background-position:center;
}

.slide.active{
  display:block;
}

.el{
  position:absolute;
  left:50%;
  top:50%;
  z-index:3;
}

.textEl{
  white-space:pre-wrap;
  line-height:1.25;
}

.imageEl,
.videoEl{
  max-height:70%;
  object-fit:contain;
}

.status{
  position:fixed;
  z-index:9999;
  left:8px;
  top:8px;
  padding:6px 9px;
  border-radius:6px;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:12px;
}

.ok{
  color:#7ee787;
}

.bad{
  color:#ff8b8b;
}

.progress{
  position:fixed;
  left:0;
  bottom:0;
  width:0;
  height:5px;
  background:#55b9ff;
  z-index:9998;
}

.counter{
  position:fixed;
  right:3%;
  bottom:2%;
  z-index:9998;
  color:#fff;
  font-size:14px;
  opacity:.7;
}
</style>
</head>
