<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Digital Board Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#edf2f7;color:#152238}.app{display:grid;grid-template-columns:420px 1fr;height:100vh}.panel{background:#fff;padding:18px;overflow:auto;box-shadow:3px 0 14px #0002}.panel h1{font-size:22px;margin:0 0 3px}.hint{font-size:11px;color:#68788c;margin-bottom:12px}.sec{border-top:1px solid #e2e8ef;padding-top:11px;margin-top:13px}.sec h3{font-size:14px;color:#0067b8;margin:0 0 9px}.field{margin-bottom:9px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:8px;border:1px solid #cbd5df;border-radius:6px}.field textarea{height:54px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.toolbar{display:flex;gap:5px;flex-wrap:wrap}.toolbar button,.btn{border:0;border-radius:6px;padding:8px 10px;background:#0067b8;color:#fff;font-weight:700;cursor:pointer}.toolbar .secondary,.secondary{background:#e8eef5;color:#17324d}.danger{background:#b42318!important}.slideList,.elementList{display:grid;gap:6px}.slideRow{display:grid;grid-template-columns:1fr auto auto;gap:5px}.slideRow button{padding:7px;border:0;border-radius:5px;cursor:pointer}.slideRow .selected{background:#0067b8;color:#fff}.elementRow{border:1px solid #dde5ed;border-radius:6px;padding:7px;cursor:pointer}.elementRow.selected{border-color:#0067b8;background:#eef7ff}.workspace{display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.screen{position:relative;overflow:hidden;width:min(calc((100vh - 40px)*.5625),calc(100vw - 470px));aspect-ratio:9/16;max-height:calc(100vh - 40px);background:#071a33;box-shadow:0 16px 44px #16324d40}.slide{position:absolute;inset:0;display:none;background-size:cover;background-position:center}.slide.active{display:block}.el{position:absolute;left:50%;top:50%;transform:translate(calc(-50% + var(--x,0px)),calc(-50% + var(--y,0px)));z-index:3;cursor:move;touch-action:none}.textEl{width:86%;text-align:center;color:var(--color,#fff);font-size:var(--fs,40px);white-space:pre-wrap;line-height:1.25}.imageEl,.videoEl{width:var(--w,45%);max-height:70%;object-fit:contain}.audioEl{width:var(--w,70%)}.selectedEl{outline:2px dashed #55b9ff;outline-offset:5px}.progress{position:absolute;z-index:30;left:0;bottom:0;height:5px;background:#55b9ff}.counter{position:absolute;z-index:31;right:4%;bottom:2%;font-size:13px;color:#fff;opacity:.7}.screen:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;box-shadow:none}@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}.panel{height:auto}.screen{width:min(92vw,540px);max-height:none}.workspace{min-height:100vh}}
</style></head><body><div class="app"><aside class="panel">
<h1>Digital Board Studio</h1><div class="hint">1080×1920 • เพิ่ม/ลบสไลด์ • ข้อความ/รูป/วิดีโอ/เสียง • Save/Load Project • Auto Save</div>
<div class="sec"><h3>โปรเจกต์</h3><div class="toolbar"><button id="saveProject">💾 บันทึกโปรเจกต์</button><button id="loadProject" class="secondary">📂 โหลดโปรเจกต์</button></div><input id="projectFile" type="file" accept="application/json,.json" hidden><div id="saveStatus" class="hint" style="margin-top:7px"></div></div>
<div class="sec"><h3>สไลด์</h3><div id="slideList" class="slideList"></div><div class="toolbar" style="margin-top:7px"><button id="addSlide">+ เพิ่มสไลด์</button><button id="dupSlide" class="secondary">ทำสำเนา</button><button id="delSlide" class="danger">ลบสไลด์</button></div></div>
<div class="sec"><h3>พื้นหลังสไลด์</h3><div class="row"><div class="field"><label>สีพื้นหลัง</label><input id="bgColor" type="color" value="#0067b8"></div><div class="field"><label>เวลาแสดง (วินาที)</label><input id="duration" type="number" min="1" value="10"></div></div><div class="field"><label>ภาพพื้นหลัง</label><input id="bgImage" type="file" accept="image/*"></div><button id="clearBg" class="btn secondary">ล้างภาพพื้นหลัง</button></div>
<div class="sec"><h3>เพิ่มองค์ประกอบ</h3><div class="toolbar"><button data-add="text">+ ข้อความ</button><button data-add="image">+ รูปย่อย</button><button data-add="video">+ วิดีโอ</button><button data-add="audio">+ เสียง</button></div><div id="elementList" class="elementList" style="margin-top:8px"></div></div>
<div class="sec"><h3>แก้ไของค์ประกอบที่เลือก</h3><div id="noSelection" class="hint">คลิกองค์ประกอบใน Preview หรือรายการด้านบน</div><div id="editFields" style="display:none"><div class="field" id="textBox"><label>ข้อความ</label><textarea id="textValue"></textarea></div><div class="row"><div class="field" id="fontBox"><label>ขนาดตัวอักษร</label><input id="fontSize" type="number"></div><div class="field" id="colorBox"><label>สีตัวอักษร</label><input id="textColor" type="color"></div></div><div class="row"><div class="field"><label>X</label><input id="posX" type="number"></div><div class="field"><label>Y</label><input id="posY" type="number"></div></div><div class="field" id="widthBox"><label>ขนาดสื่อ (%)</label><input id="mediaWidth" type="number" min="5" max="100"></div><button id="removeElement" class="btn danger">ลบองค์ประกอบ</button></div></div>
<div class="sec"><div class="toolbar"><button id="fullscreen">▶ Full Screen</button><button id="playFirst" class="secondary">เริ่มจากสไลด์แรก</button></div></div>
</aside><main class="workspace"><div id="screen" class="screen"><div id="progress" class="progress"></div><div id="counter" class="counter"></div></div></main></div>
<script>
const $=id=>document.getElementById(id),screen=$('screen');const PROJECT_KEY='digitalBoardStudioProjectV1';let slides=[],activeSlide=0,selectedId=null,timer=null,drag=null,idSeq=1;
const freshSlide=()=>({id:idSeq++,bg:'#0067b8',bgImage:'',duration:10,elements:[]});
function current(){return slides[activeSlide]}function uid(){return'e'+(idSeq++)}function selected(){return current()?.elements.find(e=>e.id===selectedId)}function makeText(text='ข้อความใหม่'){return{id:uid(),type:'text',text,x:0,y:0,fs:54,color:'#ffffff'}}
function projectData(){return{version:1,canvas:{width:1080,height:1920},slides,activeSlide,savedAt:new Date().toISOString()}}
function validProject(p){return p&&Array.isArray(p.slides)&&p.slides.length>0}
function recomputeIdSeq(){let max=0;slides.forEach(s=>{max=Math.max(max,Number(s.id)||0);(s.elements||[]).forEach(e=>{const n=Number(String(e.id||'').replace(/\D/g,''))||0;max=Math.max(max,n)})});idSeq=max+1}
function autosave(){try{localStorage.setItem(PROJECT_KEY,JSON.stringify(projectData()));$('saveStatus').textContent='บันทึกในเครื่องแล้ว'}catch(e){$('saveStatus').textContent='Auto Save ไม่สำเร็จ';console.warn(e)}}
function restoreLocal(){try{const raw=localStorage.getItem(PROJECT_KEY);if(!raw)return false;const p=JSON.parse(raw);if(!validProject(p))return false;slides=p.slides;activeSlide=Math.min(Math.max(0,Number(p.activeSlide)||0),slides.length-1);selectedId=null;recomputeIdSeq();return true}catch(e){return false}}
function downloadProject(){const blob=new Blob([JSON.stringify(projectData(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='digital-board-project.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);$('saveStatus').textContent='ดาวน์โหลดไฟล์โปรเจกต์แล้ว'}
$('saveProject').onclick=downloadProject;$('loadProject').onclick=()=>$('projectFile').click();$('projectFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!validProject(p))throw 0;slides=p.slides;activeSlide=Math.min(Math.max(0,Number(p.activeSlide)||0),slides.length-1);selectedId=null;recomputeIdSeq();autosave();render(false);$('saveStatus').textContent='โหลดโปรเจกต์แล้ว'}catch(err){alert('ไฟล์โปรเจกต์ไม่ถูกต้อง')}};r.readAsText(f);e.target.value=''};
function render(save=true){screen.querySelectorAll('.slide').forEach(n=>n.remove());slides.forEach((s,i)=>{const d=document.createElement('section');d.className='slide'+(i===activeSlide?' active':'');d.style.backgroundColor=s.bg||'#0067b8';d.style.backgroundImage=s.bgImage?`url(${s.bgImage})`:'';(s.elements||[]).forEach(e=>d.appendChild(renderElement(e)));screen.insertBefore(d,$('progress'))});$('counter').textContent=`${activeSlide+1} / ${slides.length}`;renderSlideList();renderElementList();loadSlideControls();loadEditor();restartTimer();if(save)autosave()}
function renderElement(e){let n;if(e.type==='text'){n=document.createElement('div');n.className='el textEl';n.textContent=e.text;n.style.setProperty('--fs',(e.fs||40)+'px');n.style.setProperty('--color',e.color||'#fff')}else if(e.type==='image'){n=document.createElement('img');n.className='el imageEl';n.src=e.src||''}else if(e.type==='video'){n=document.createElement('video');n.className='el videoEl';n.src=e.src||'';n.controls=true;n.loop=true;n.muted=true;n.playsInline=true}else{n=document.createElement('audio');n.className='el audioEl';n.src=e.src||'';n.controls=true;n.loop=true}if(e.type!=='text')n.style.setProperty('--w',(e.w||45)+'%');n.id=e.id;n.style.setProperty('--x',(e.x||0)+'px');n.style.setProperty('--y',(e.y||0)+'px');if(e.id===selectedId)n.classList.add('selectedEl');n.onpointerdown=startDrag;n.onclick=ev=>{ev.stopPropagation();selectElement(e.id)};return n}
function renderSlideList(){$('slideList').innerHTML='';slides.forEach((s,i)=>{const r=document.createElement('div');r.className='slideRow';r.innerHTML=`<button class="${i===activeSlide?'selected':''}" data-i="${i}">Slide ${i+1}</button><button data-up="${i}">↑</button><button data-down="${i}">↓</button>`;$('slideList').appendChild(r)});document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{activeSlide=+b.dataset.i;selectedId=null;render()});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveSlide(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveSlide(+b.dataset.down,1))}
function moveSlide(i,s){const j=i+s;if(j<0||j>=slides.length)return;[slides[i],slides[j]]=[slides[j],slides[i]];activeSlide=j;render()}
function renderElementList(){$('elementList').innerHTML='';(current().elements||[]).forEach((e,i)=>{const r=document.createElement('div');r.className='elementRow'+(e.id===selectedId?' selected':'');r.textContent=`${i+1}. ${e.type==='text'?(e.text||'ข้อความ').slice(0,28):e.type.toUpperCase()}`;r.onclick=()=>selectElement(e.id);$('elementList').appendChild(r)})}
function selectElement(id){selectedId=id;renderElementList();loadEditor();screen.querySelectorAll('.el').forEach(n=>n.classList.toggle('selectedEl',n.id===id))}function loadSlideControls(){const s=current();$('bgColor').value=s.bg||'#0067b8';$('duration').value=s.duration||10}
function loadEditor(){const e=selected(),has=!!e;$('noSelection').style.display=has?'none':'block';$('editFields').style.display=has?'block':'none';if(!has)return;const t=e.type==='text';$('textBox').style.display=t?'block':'none';$('fontBox').style.display=t?'block':'none';$('colorBox').style.display=t?'block':'none';$('widthBox').style.display=t?'none':'block';if(t){$('textValue').value=e.text||'';$('fontSize').value=e.fs||40;$('textColor').value=e.color||'#ffffff'}$('posX').value=e.x||0;$('posY').value=e.y||0;if(!t)$('mediaWidth').value=e.w||45}
function fileData(file,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}function addMedia(type){const inp=document.createElement('input');inp.type='file';inp.accept=type+'/*';inp.onchange=()=>{const f=inp.files[0];if(f)fileData(f,src=>{const e={id:uid(),type,src,x:0,y:0,w:type==='audio'?70:55};current().elements.push(e);selectedId=e.id;render()})};inp.click()}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(b.dataset.add==='text'){const e=makeText();current().elements.push(e);selectedId=e.id;render()}else addMedia(b.dataset.add)});
$('addSlide').onclick=()=>{slides.push(freshSlide());activeSlide=slides.length-1;selectedId=null;render()};$('delSlide').onclick=()=>{if(slides.length<=1)return;slides.splice(activeSlide,1);activeSlide=Math.max(0,activeSlide-1);selectedId=null;render()};$('dupSlide').onclick=()=>{const c=JSON.parse(JSON.stringify(current()));c.id=idSeq++;(c.elements||[]).forEach(e=>e.id=uid());slides.splice(activeSlide+1,0,c);activeSlide++;selectedId=null;render()};
$('bgColor').oninput=e=>{current().bg=e.target.value;render()};$('duration').onchange=e=>{current().duration=Math.max(1,+e.target.value||1);render()};$('bgImage').onchange=e=>{const f=e.target.files[0];if(f)fileData(f,v=>{current().bgImage=v;render()})};$('clearBg').onclick=()=>{current().bgImage='';render()};
function edit(p,v){const e=selected();if(!e)return;e[p]=v;render()}$('textValue').oninput=e=>edit('text',e.target.value);$('fontSize').oninput=e=>edit('fs',Math.max(8,+e.target.value||8));$('textColor').oninput=e=>edit('color',e.target.value);$('posX').oninput=e=>edit('x',+e.target.value||0);$('posY').oninput=e=>edit('y',+e.target.value||0);$('mediaWidth').oninput=e=>edit('w',Math.min(100,Math.max(5,+e.target.value||5)));$('removeElement').onclick=()=>{current().elements=current().elements.filter(e=>e.id!==selectedId);selectedId=null;render()};
function startDrag(ev){const e=current().elements.find(x=>x.id===ev.currentTarget.id);if(!e)return;selectedId=e.id;ev.preventDefault();const r=screen.getBoundingClientRect();drag={e,sx:ev.clientX,sy:ev.clientY,bx:e.x||0,by:e.y||0,kx:1080/r.width,ky:1920/r.height};selectElement(e.id)}document.addEventListener('pointermove',ev=>{if(!drag)return;drag.e.x=Math.round(drag.bx+(ev.clientX-drag.sx)*drag.kx);drag.e.y=Math.round(drag.by+(ev.clientY-drag.sy)*drag.ky);const n=$(drag.e.id);if(n){n.style.setProperty('--x',drag.e.x+'px');n.style.setProperty('--y',drag.e.y+'px')}$('posX').value=drag.e.x;$('posY').value=drag.e.y});document.addEventListener('pointerup',()=>{if(drag){drag=null;autosave()}});
function restartTimer(){clearTimeout(timer);const s=current();$('progress').style.transition='none';$('progress').style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{$('progress').style.transition=`width ${s.duration||10}s linear`;$('progress').style.width='100%'}));timer=setTimeout(()=>{activeSlide=(activeSlide+1)%slides.length;selectedId=null;render(false)},(s.duration||10)*1000)}
$('playFirst').onclick=()=>{activeSlide=0;selectedId=null;render(false)};$('fullscreen').onclick=async()=>{try{if(screen.requestFullscreen)await screen.requestFullscreen();try{if(window.screen.orientation?.lock)await window.screen.orientation.lock('portrait')}catch(e){}}catch(e){}};screen.onclick=()=>selectElement(null);
if(!restoreLocal())slides=[freshSlide()];render(false);if(localStorage.getItem(PROJECT_KEY))$('saveStatus').textContent='โหลด Auto Save จากเครื่องแล้ว';
</script></body></html>
